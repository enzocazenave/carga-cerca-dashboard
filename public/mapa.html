<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#eef2f6" />
  <meta name="color-scheme" content="light" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>CargaCerca · Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/pwa.js" defer></script>
  <style>
    :root {
      --green: #16a34a;
      --green-soft: #22c55e;
      --ink: #0f172a;
      --muted: #64748b;
      --card: #ffffff;
      --page: #eef2f6;
      --ring: rgba(15, 23, 42, 0.06);
      --blue: #2563eb;
      --amber: #d97706;
      --red: #ef4444;
      --gray: #94a3b8;
      --sheet-shadow: 0 -10px 32px -14px rgba(15, 23, 42, 0.3);
      --fab-shadow: 0 6px 18px -4px rgba(15, 23, 42, 0.35);
      --sheet-h: 30vh;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--page);
      color: var(--ink);
      animation: fadeIn 0.35s ease;
    }
    [hidden] { display: none !important; }
    button { font: inherit; }

    #map {
      position: fixed;
      inset: 0;
      background: #dfe6ee;
    }

    /* ---- Pill flotante superior ---- */
    .top-pill {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 16px;
      z-index: 30;
      background: var(--card);
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: var(--fab-shadow);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .top-pill b { color: var(--green); }

    /* ---- Botón flotante de ubicación ---- */
    .locate-fab {
      position: fixed;
      right: 16px;
      bottom: calc(var(--sheet-h) + 16px);
      z-index: 30;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--card);
      box-shadow: var(--fab-shadow);
      display: grid;
      place-items: center;
      color: var(--blue);
      transition: bottom 0.28s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s ease;
    }
    body.dragging-sheet .locate-fab { transition: none; }
    .locate-fab:active { transform: scale(0.92); }
    .locate-fab.active { color: var(--green); }
    .locate-fab svg { width: 22px; height: 22px; }

    /* ---- Hoja inferior ---- */
    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 25;
      background: var(--page);
      border-radius: 20px 20px 0 0;
      box-shadow: var(--sheet-shadow);
      display: flex;
      flex-direction: column;
      height: var(--sheet-h);
      min-height: 160px;
      max-height: 86vh;
      transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dragging-sheet .sheet { transition: none; }

    .sheet-drag {
      flex: none;
      padding: 9px 0 4px;
      touch-action: none;
      cursor: grab;
    }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: #cbd5e1; margin: 0 auto; }

    .sheet-head { padding: 2px 18px 8px; flex: none; }
    .sheet-head h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
    .sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    .list {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 14px calc(env(safe-area-inset-bottom) + 16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .banner {
      margin: 0 14px 10px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: none;
    }
    .banner button {
      border: none;
      background: #9a3412;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex: none;
    }

    .charger-row {
      background: var(--card);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 1px 3px var(--ring);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .charger-row.highlight { box-shadow: 0 0 0 2px var(--green); transform: translateY(-1px); }

    .row-icon {
      width: 42px; height: 42px;
      border-radius: 13px;
      display: grid; place-items: center;
      font-size: 19px;
      flex: none;
    }

    .row-main { min-width: 0; flex: 1 1 auto; }
    .row-name { font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-status { font-size: 12.5px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-status b { color: inherit; }

    .row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .row-dist { font-size: 12px; font-weight: 700; color: var(--muted); }

    .row-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, var(--green), #0d9488);
      cursor: pointer;
      white-space: nowrap;
    }
    .row-btn svg { flex: none; }
    .row-btn[disabled] { background: #e2e8f0; color: #94a3b8; }
    .row-btn.ghost { background: none; color: var(--blue); padding: 8px 4px; }

    .empty-list { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 10px; }

    /* ---- Marcadores Leaflet ---- */
    .cc-pin-wrap {
      filter: drop-shadow(0 3px 5px rgba(15, 23, 42, 0.4));
      animation: pinDrop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom center;
    }
    .cc-me-wrap { animation: fadeIn 0.3s ease; }
    .cc-me {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--blue);
      border: 3px solid #fff;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.4);
      position: relative;
    }
    .cc-me::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(37, 99, 235, 0.45);
      animation: ping-me 2s ease-out infinite;
    }
    @keyframes ping-me { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); } 70%, 100% { box-shadow: 0 0 0 12px rgba(37, 99, 235, 0); } }
    @keyframes pinDrop { from { transform: translateY(-16px) scale(0.5); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cc-me::after, .cc-pin-wrap, body { animation: none; }
    }

    .leaflet-popup-content-wrapper { border-radius: 14px; background: var(--card); color: var(--ink); }
    .leaflet-popup-tip { background: var(--card); }
    .leaflet-popup-content { margin: 10px 12px; font-family: inherit; }
    .popup-name { font-weight: 800; font-size: 13.5px; }
    .popup-status { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.75) !important;
      font-size: 10px !important;
    }
    .leaflet-bottom.leaflet-left { margin-bottom: calc(var(--sheet-h) + 6px); transition: margin-bottom 0.32s cubic-bezier(0.4, 0, 0.2, 1); }
    body.dragging-sheet .leaflet-bottom.leaflet-left { transition: none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top-pill">Carga<b>Cerca</b></div>

  <div class="sheet" id="sheet">
    <div class="sheet-drag" id="sheetDrag">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-head">
      <h1 id="sheetTitle">Cargadores cerca tuyo</h1>
      <p id="sheetSub">Buscando tu ubicación…</p>
    </div>
    <div id="banner"></div>
    <div class="list" id="list"></div>
  </div>

  <button class="locate-fab" id="locateBtn" aria-label="Centrar en mi ubicación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>
  </button>

  <script src="/icons.js"></script>
  <script src="/mapa.js"></script>
</body>
</html>
