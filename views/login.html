<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111729" />
  <meta name="robots" content="noindex" />
  <title>CargaCerca · Entrar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/brand.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      padding: 32px 16px;
      font-family: var(--cc-font); font-weight: 500; color: var(--cc-navy);
      background-color: var(--cc-navy);
      /* La grilla de calles del libro de marca */
      background-image:
        linear-gradient(rgba(17, 23, 41, 0.75), rgba(17, 23, 41, 0.75)),
        repeating-linear-gradient(76deg, transparent 0 86px, #1D2539 86px 94px),
        repeating-linear-gradient(-14deg, transparent 0 86px, #1D2539 86px 94px);
    }
    .box { width: 100%; max-width: 400px; }
    .box > a { display: block; width: max-content; margin: 0 auto 28px; }
    .box > a .cc-logo { height: 44px; }
    .card { background: #fff; border-radius: 24px; padding: 30px; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7); }
    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: var(--cc-title-tracking); }
    .sub { margin: 6px 0 22px; color: var(--cc-muted); font-size: 15px; }
    label { display: block; font-size: 13.5px; font-weight: 800; margin: 14px 0 7px; }
    input {
      width: 100%; border: 1.5px solid var(--cc-line); border-radius: 12px;
      padding: 12px 14px; font: inherit; font-size: 16px; color: var(--cc-navy);
    }
    input:focus { outline: none; border-color: var(--cc-blue); box-shadow: 0 0 0 3px rgba(78, 128, 238, 0.22); }
    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
      background: var(--cc-navy); color: #fff; margin-top: 18px;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn.light { background: var(--cc-surface); color: var(--cc-navy); margin-top: 0; font-size: 14.5px; }
    .btn.light:hover { background: var(--cc-niebla); }
    button:focus-visible { outline: 3px solid var(--cc-blue); outline-offset: 2px; }
    .err { min-height: 20px; margin-top: 12px; color: var(--cc-red); font-size: 14px; font-weight: 700; }
    .demo { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--cc-line); }
    .demo p { margin: 0 0 10px; font-size: 13px; color: var(--cc-muted); font-weight: 600; }
    .demo div { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .foot { text-align: center; margin-top: 20px; font-size: 13.5px; color: rgba(231, 233, 238, 0.7); }
    .foot a { color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <a href="/" aria-label="CargaCerca, inicio"><img class="cc-logo" src="/brand/logo-horizontal-oscuro.svg" alt="CargaCerca" /></a>
    <div class="card">
      <h1>Entrá a tu panel</h1>
      <p class="sub">Para anfitriones y el equipo de CargaCerca.</p>
      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button class="btn" type="submit" id="loginBtn">Entrar</button>
        <div class="err" id="err" role="alert"></div>
      </form>
      <div class="demo" id="demo" hidden>
        <p>Modo demo, sin contraseña</p>
        <div>
          <button class="btn light" type="button" data-demo="anfitrion">Anfitrión demo</button>
          <button class="btn light" type="button" data-demo="admin">Admin demo</button>
        </div>
      </div>
    </div>
    <p class="foot">¿Querés sumar tu cargador? <a href="/#sumate">Anotate acá</a></p>
  </div>
  <script src="/login.js"></script>
</body>
</html>
