<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#F4F5F8" />
  <meta name="color-scheme" content="light" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>CargaCerca · Mapa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Calles vectoriales (OpenFreeMap) dibujadas con MapLibre dentro de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="/pwa.js" defer></script>
  <style>
    :root {
      --ink: var(--cc-navy);
      --muted: var(--cc-muted);
      --card: #ffffff;
      --page: var(--cc-surface);
      --ring: rgba(17, 23, 41, 0.07);
      --sheet-shadow: 0 -10px 32px -14px rgba(17, 23, 41, 0.3);
      --fab-shadow: 0 6px 18px -4px rgba(17, 23, 41, 0.35);
      --sheet-h: 30vh;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      font-family: var(--cc-font);
      font-weight: 500;
      background: var(--page);
      color: var(--ink);
      animation: fadeIn 0.35s ease;
    }
    [hidden] { display: none !important; }
    button { font: inherit; }

    #map {
      position: fixed;
      inset: 0;
      background: #EEF0F4;
    }
    /* Solo si no hay WebGL y caemos a los tiles raster de Esri: grises, para
       que no se vean amarillentos y los pines de marca resalten igual. */
    #map.raster-fallback .leaflet-tile-pane { filter: grayscale(1) brightness(1.04) contrast(0.92); }

    /* ---- Logo flotante superior ---- */
    .top-pill {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 16px;
      z-index: 30;
      background: var(--card);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: var(--fab-shadow);
      display: block;
    }

    /* ---- Botón flotante de ubicación ---- */
    .locate-fab {
      position: fixed;
      right: 16px;
      bottom: calc(var(--sheet-h) + 16px);
      z-index: 30;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--card);
      box-shadow: var(--fab-shadow);
      display: grid;
      place-items: center;
      color: var(--cc-blue);
      transition: bottom 0.28s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s ease;
    }
    body.dragging-sheet .locate-fab { transition: none; }
    .locate-fab:active { transform: scale(0.92); }
    .locate-fab.active { color: var(--cc-green); }
    .locate-fab svg { width: 22px; height: 22px; }

    /* ---- Hoja inferior ---- */
    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 25;
      background: var(--page);
      border-radius: 22px 22px 0 0;
      box-shadow: var(--sheet-shadow);
      display: flex;
      flex-direction: column;
      height: var(--sheet-h);
      min-height: 160px;
      max-height: 86vh;
      transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dragging-sheet .sheet { transition: none; }

    .sheet-drag {
      flex: none;
      padding: 9px 0 4px;
      touch-action: none;
      cursor: grab;
    }
    .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: #c9cdd7; margin: 0 auto; }

    .sheet-head { padding: 2px 18px 8px; flex: none; }
    .sheet-head h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

    .list {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 14px calc(env(safe-area-inset-bottom) + 16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .banner {
      margin: 0 14px 10px;
      background: var(--cc-amber-soft);
      border: 1px solid #f6d3a8;
      color: var(--cc-amber);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex: none;
    }
    .banner button {
      border: none;
      background: var(--cc-amber);
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      flex: none;
    }

    .charger-row {
      background: var(--card);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 1px 3px var(--ring);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .charger-row.highlight { box-shadow: 0 0 0 2px var(--cc-blue); transform: translateY(-1px); }

    .row-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: grid; place-items: center;
      flex: none;
    }

    .row-main { min-width: 0; flex: 1 1 auto; }
    .row-name { font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-status { font-size: 12.5px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-status b { color: inherit; font-weight: 700; }

    .row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .row-dist { font-size: 12px; font-weight: 700; color: var(--muted); }

    .row-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      background: var(--cc-navy);
      cursor: pointer;
      white-space: nowrap;
    }
    .row-btn svg { flex: none; }
    .row-btn[disabled] { background: var(--cc-niebla); color: var(--muted); }
    .row-btn.ghost { background: none; color: var(--cc-blue-ink); padding: 8px 4px; }

    .empty-list { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 10px; }

    /* ---- Marcadores Leaflet ---- */
    .cc-pin-wrap {
      filter: drop-shadow(0 2px 4px rgba(17, 23, 41, 0.35));
      animation: pinDrop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cc-pin-wrap.dim { opacity: 0.55; }
    /* Halo que late del conductor ("Pin de auto" del libro de marca). */
    .cc-halo { transform-origin: center; transform-box: fill-box; animation: halo 2s ease-out infinite; }
    .cc-me-wrap { animation: fadeIn 0.3s ease; }
    @keyframes halo { 0% { transform: scale(0.75); opacity: 0.55; } 100% { transform: scale(1.25); opacity: 0; } }
    @keyframes pinDrop { from { transform: translateY(-12px) scale(0.5); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .cc-halo, .cc-pin-wrap, body { animation: none; }
    }

    .leaflet-container { font-family: var(--cc-font); }
    .leaflet-popup-content-wrapper { border-radius: 14px; background: var(--card); color: var(--ink); }
    .leaflet-popup-tip { background: var(--card); }
    .leaflet-popup-content { margin: 10px 12px; font-family: inherit; }
    .popup-name { font-weight: 800; font-size: 13.5px; }
    .popup-status { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .popup-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--cc-green)); flex: none; }
    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.75) !important;
      font-size: 10px !important;
    }
    .leaflet-bottom.leaflet-left { margin-bottom: calc(var(--sheet-h) + 6px); transition: margin-bottom 0.32s cubic-bezier(0.4, 0, 0.2, 1); }
    body.dragging-sheet .leaflet-bottom.leaflet-left { transition: none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top-pill">
    <img class="cc-logo" src="/brand/logo-horizontal-claro.svg" alt="CargaCerca" />
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-drag" id="sheetDrag">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-head">
      <h1 id="sheetTitle">Cargadores cerca tuyo</h1>
      <p id="sheetSub">Buscando tu ubicación…</p>
    </div>
    <div id="banner"></div>
    <div class="list" id="list"></div>
  </div>

  <button class="locate-fab" id="locateBtn" aria-label="Centrar en mi ubicación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
    </svg>
  </button>

  <script src="/icons.js"></script>
  <script src="/conductor.js"></script>
  <script src="/mapa.js"></script>
</body>
</html>
