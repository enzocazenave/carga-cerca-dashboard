<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>CargaCerca · Panel de cargadores</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/admin"><img class="cc-logo" src="/brand/logo-horizontal-oscuro.svg" alt="CargaCerca" /></a>
      <nav class="nav">
        <a href="/admin" class="active">Cargadores</a>
        <a href="/admin/anfitriones">Anfitriones</a>
        <a href="/admin/interesados">Interesados</a>
        <a href="/mapa">Mapa</a>
      </nav>
      <div class="user-menu" id="userMenu"></div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Red de cargadores</h1>
        <div class="sub">Últimos 30 días en toda la red</div>
      </div>
      <button class="btn" id="addBtn">+ Agregar cargador</button>
    </div>

    <div class="metrics" id="summary"></div>

    <div class="section-title">Cargadores</div>
    <div id="list" class="grid"></div>
    <div id="empty" class="empty" hidden>Todavía no hay cargadores. Agregá el primero con el botón de arriba.</div>
  </main>

  <div id="modalRoot"></div>

  <script src="/icons.js"></script>
  <script src="/conductor.js"></script>
  <script src="/panel.js"></script>
  <script src="/list.js"></script>
</body>
</html>
